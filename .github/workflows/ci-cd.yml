name: CI and deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Component to deploy (changed uses the last successful main release)
        type: choice
        default: changed
        options:
          - changed
          - all
          - identity-service
          - property-service
          - crm-service
          - gateway
          - frontend-client
          - client-facing
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
      checks: ${{ steps.select.outputs.checks }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change detection
        run: python3 scripts/ci/test_pipeline.py
      - id: select
        name: Select affected components
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SERVICE: ${{ inputs.service || 'changed' }}
        run: python3 scripts/ci/pipeline.py select
  verify:
    needs: changes
    if: needs.changes.outputs.checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.checks) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: contains(fromJSON('["frontend-client", "client-facing"]'), matrix.service)
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v5
        if: ${{ !contains(fromJSON('["frontend-client", "client-facing"]'), matrix.service) }}
        with:
          dotnet-version: 10.0.x
      - name: Build and test component
        env:
          COMPONENT: ${{ matrix.service }}
        run: python3 scripts/ci/pipeline.py check "$COMPONENT"
  deploy:
    needs: [changes, verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check cloud authentication configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" || { echo 'Set GCP_WORKLOAD_IDENTITY_PROVIDER in repository Actions variables'; exit 1; }
          test -n "$ACCOUNT" || { echo 'Set GCP_DEPLOY_SERVICE_ACCOUNT in repository Actions variables'; exit 1; }
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: project-ff46407b-1a09-4376-95a

      - name: Authenticate container registry
        env:
          REGISTRY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: printf %s "$REGISTRY_TOKEN" | docker login africa-south1-docker.pkg.dev --username oauth2accesstoken --password-stdin
      - name: Build and deploy changed components
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DEPLOY_SERVICES: ${{ needs.changes.outputs.services }}
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
        run: python3 scripts/ci/pipeline.py deploy
