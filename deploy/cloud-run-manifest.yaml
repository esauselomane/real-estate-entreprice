apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: identity-service
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/sql-instance: PROJECT_ID:REGION:INSTANCE_NAME
        run.googleapis.com/vpc-access-connector: VPC_CONNECTOR
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: identity-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPO/identity-service:SHORT_SHA
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: "1"
              memory: 512Mi
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://*:8080
            - name: ConnectionStrings__DefaultConnection
              value: "Server=10.x.x.x;Database=IdentityDB;User Id=sqlserver;Password=PASSWORD;TrustServerCertificate=True;Encrypt=False;"
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            - name: Jwt__Issuer
              value: "Identity.Microservice"
            - name: Jwt__Audience
              value: "RealEstateApp.Client"
            - name: Cors__AllowedOrigins__0
              value: "https://app.biscovetech.com"
            - name: Cors__AllowedOrigins__1
              value: "https://www.biscovetech.com"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
  traffic:
    - latestRevision: true
      percent: 100
---
