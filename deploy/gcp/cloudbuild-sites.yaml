# Build the company website and real estate frontend only.
# Deployment updates existing Cloud Run images without replacing their settings.
substitutions:
  _REGION: africa-south1
  _REPOSITORY: realestate-images
  _TAG: manual
  _GATEWAY_URL: https://api.biscovetech.com
  _APP_URL: https://app.biscovetech.com
  _SITE_URL: https://www.biscovetech.com
  _LAND_APP_URL: https://landadmin.biscovetech.com
  _GOOGLE_MAPS_API_KEY: ''
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
steps:
  - id: build-marketing
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_GATEWAY_URL=${_GATEWAY_URL}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_LAND_APP_URL=${_LAND_APP_URL}
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/client-facing:${_TAG}
      - -f=client-facing-app/Dockerfile
      - .
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - --build-arg=VITE_API_BASE_URL=${_GATEWAY_URL}/gateway
      - --build-arg=VITE_COMPANY_SITE_URL=${_SITE_URL}
      - --build-arg=VITE_GOOGLE_MAPS_API_KEY=${_GOOGLE_MAPS_API_KEY}
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend-client:${_TAG}
      - -f=frontend-client/Dockerfile
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/client-facing:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend-client:${_TAG}
timeout: 1800s
