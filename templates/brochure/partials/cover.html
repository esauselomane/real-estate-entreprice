<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #0F172A; page-break-after: always;">
  <div style="padding: 40px;">
    <h1 style="font-size: 28px; font-weight: 600; margin: 0 0 20px 0;">REAL ESTATE PORTFOLIO PROPOSAL</h1>
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 60px;">
      {{{logoHtml}}}
      <span style="font-size: 18px; font-weight: bold;">{{companyName}}</span>
    </div>
    <div style="border-top: 1px solid #334155; padding-top: 20px; margin-bottom: 30px;">
      <p style="font-size: 11px; color: #94A3B8; margin: 0 0 4px 0;">PREPARED BY:</p>
      <p style="font-size: 16px; font-weight: bold; margin: 0;">{{brokerName}}</p>
      <p style="font-size: 11px; color: #94A3B8; margin: 4px 0 0 0;">{{brokerEmail}}</p>
      <p style="font-size: 11px; color: #94A3B8; margin: 4px 0 0 0;">{{brokerPhone}}</p>
    </div>
    <div style="border-top: 1px solid #334155; padding-top: 20px;">
      <p style="font-size: 11px; color: #94A3B8; margin: 0 0 4px 0;">PREPARED FOR:</p>
      <p style="font-size: 16px; font-weight: bold; margin: 0;">{{clientName}}</p>
      {{#if clientEmail}}
      <p style="font-size: 11px; color: #94A3B8; margin: 4px 0 0 0;">{{clientEmail}}</p>
      {{/if}}
      {{#if clientPhone}}
      <p style="font-size: 11px; color: #94A3B8; margin: 4px 0 0 0;">{{clientPhone}}</p>
      {{/if}}
    </div>
  </div>
</div>
