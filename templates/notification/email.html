<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; color: #e2e8f0; }
    .container { max-width: 600px; margin: 0 auto; padding: 48px 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 40px; }
    .badge { display: inline-block; background: {{badge_color}}; color: #ffffff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 14px; border-radius: 9999px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; color: #f8fafc; margin: 0 0 16px 0; }
    p { font-size: 15px; line-height: 1.6; color: #cbd5e1; margin: 0 0 16px 0; }
    .cta-button { display: inline-block; background: #2563eb; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px; padding: 14px 32px; border-radius: 14px; border: none; transition: background 0.2s; }
    .cta-button:hover { background: #1d4ed8; }
    .footer { font-size: 12px; color: #64748b; text-align: center; margin-top: 32px; line-height: 1.6; }
    .highlight { color: #38bdf8; font-weight: 600; }
    .details { background: #111827; border: 1px solid #374151; border-radius: 12px; padding: 20px; margin: 24px 0; }
    .details dt { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 4px 0; }
    .details dd { font-size: 14px; color: #f1f5f9; margin: 0 0 16px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="badge">{{badge_text}}</div>
      <h1>{{title}}</h1>
      <p>Hi {{recipient_name}},</p>
      <p>{{message}}</p>
      
      {{#if details}}
      <dl class="details">
        {{#each details}}
        <dt>{{@key}}</dt>
        <dd>{{this}}</dd>
        {{/each}}
      </dl>
      {{/if}}
      
      {{#if action_url}}
      <p style="text-align: center; margin: 32px 0;">
        <a href="{{action_url}}" class="cta-button">{{action_text}}</a>
      </p>
      {{/if}}
      
      <p style="margin-top: 24px;">Questions? Contact us at <span class="highlight">{{support_email}}</span></p>
      <p class="footer">Biscove Real Estate Tech — We align the code, you sell the abode.</p>
    </div>
  </div>
</body>
</html>
