version: '3.8'

services:
  # 🗄️ SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: realestate-sqlserver
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - realestate-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 📨 Kafka Message Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: realestate-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - realestate-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: realestate-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - realestate-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 🔐 Identity Microservice
  identity-service:
    build:
      context: .
      dockerfile: backend-services/Identity.Microservice/Dockerfile
    container_name: realestate-identity
    ports:
      - "${IDENTITY_PORT:-5001}:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${IDENTITY_DB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Cors__AllowedOrigins=${CORS_ORIGINS}
      - Email__SupportEmail=${SUPPORT_EMAIL:-admin@biscovetech.com}
      - Email__Host=${EMAIL_HOST:-smtp.gmail.com}
      - Email__Port=${EMAIL_PORT:-587}
      - Email__EnableSsl=${EMAIL_ENABLE_SSL:-true}
      - Email__Username=${EMAIL_USERNAME:-admin@biscovetech.com}
      - Email__Password=${EMAIL_PASSWORD:-}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS:-admin@biscovetech.com}
      - Email__FromName=${EMAIL_FROM_NAME:-Biscove Real Estate Tech}
      - Email__AdminEmail=${ADMIN_EMAIL}
      - Email__PlatformAdminEmail=${PLATFORM_ADMIN_EMAIL}
      - Email__AgencyAdminEmail=${AGENCY_ADMIN_EMAIL}
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestate-network
    restart: unless-stopped

  # 🏠 Property Microservice
  property-service:
    build:
      context: .
      dockerfile: backend-services/Property.Microservice/Dockerfile
    container_name: realestate-property
    ports:
      - "${PROPERTY_PORT:-5002}:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Identity__BaseUrl=http://identity-service:5001
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${PROPERTY_DB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestate-network
    restart: unless-stopped

  # 💼 CRM Microservice
  crm-service:
    build:
      context: .
      dockerfile: backend-services/CRM.Microservice/Dockerfile
    container_name: realestate-crm
    ports:
      - "${CRM_PORT:-5003}:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - GoogleMaps__ApiKey=${GoogleMaps__ApiKey:-}
      - Identity__BaseUrl=http://identity-service:5001
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${CRM_DB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVERS}
      - Gateway__BaseUrl=${GATEWAY_BASE_URL}
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestate-network
    restart: unless-stopped

  # 👨‍💻 Developer API
  developer-api:
    build:
      context: .
      dockerfile: Developer.API/Dockerfile
    container_name: realestate-developer-api
    ports:
      - "${DEVELOPER_PORT:-5006}:5006"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DeveloperConnection=Server=sqlserver,1433;Database=${DEVELOPER_DB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      - ConnectionStrings__PropertyConnection=Server=sqlserver,1433;Database=${PROPERTY_DB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    depends_on:
      sqlserver:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestate-network
    restart: unless-stopped

  # 🌐 API Gateway
  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: realestate-gateway
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Cors__AllowedOrigins=${CORS_ORIGINS}
    depends_on:
      - identity-service
      - property-service
      - crm-service
      - developer-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestate-network
    restart: unless-stopped

  # 🌍 Client-Facing App (Next.js Marketing Website)
  client-facing:
    build:
      context: .
      dockerfile: client-facing-app/Dockerfile
      args:
        - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - LEAD_API_URL=${LEAD_API_URL}
    container_name: realestate-client-facing
    ports:
      - "${CLIENT_FACING_PORT:-80}:80"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - LEAD_API_URL=${LEAD_API_URL}
      - NEXT_PUBLIC_CONTACT_EMAIL=${NEXT_PUBLIC_CONTACT_EMAIL}
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestate-network
    restart: unless-stopped

  # 🖥️ Frontend Client (Vite + React Admin Portal)
  frontend-client:
    build:
      context: .
      dockerfile: frontend-client/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_API_BASE_URL: ${NEXT_PUBLIC_GATEWAY_URL}
    container_name: realestate-frontend-client
    ports:
      - "${FRONTEND_CLIENT_PORT:-80}:80"
    environment:
      - VITE_API_BASE_URL=${NEXT_PUBLIC_GATEWAY_URL}
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestate-network
    restart: unless-stopped

  # 📊 Prometheus - Metrics collection and alerting
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: realestate-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - realestate-network
    restart: unless-stopped
    depends_on:
      - identity-service
      - property-service
      - crm-service
      - developer-api
      - gateway
      - client-facing
      - frontend-client

  # 📈 Grafana - Metrics visualization and dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: realestate-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    networks:
      - realestate-network
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  sqlserver-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  realestate-network:
    driver: bridge
