global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: 'identity'
    static_configs:
      - targets: ['host.docker.internal:5001']
    metrics_path: '/health'
    scheme: 'http'
  - job_name: 'property'
    static_configs:
      - targets: ['host.docker.internal:5002']
    metrics_path: '/health'
    scheme: 'http'
  - job_name: 'crm'
    static_configs:
      - targets: ['host.docker.internal:5003']
    metrics_path: '/health'
    scheme: 'http'
  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: '/health'
    scheme: 'http'
