version: '3.8'

services:
  # 🐵 1. CENTRAL COORDINATOR ENGINE: Apache Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: realestate-zookeeper-container
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - realestate-mesh-network

  # 📨 2. HIGH-SPEED MESSAGING BUS: Apache Kafka Distributed Event Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: realestate-kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - realestate-mesh-network
  # 🗄️ 3. ISOLATED DATABASE INSTANCE: Microsoft SQL Server 2022 Express Edition
  sqlserver:
    image: mcr.microsoft.com/mssql/server
    container_name: realestate-sqlserver-db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SecureRealEstatePass123!"
      MSSQL_PID: "Express"
    volumes:
      - sqlserver-data-vault:/var/opt/mssql
    networks:
      - realestate-mesh-network

  # 📧 4. EMAIL CATCHER: Mailpit for local email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: realestate-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - realestate-mesh-network

# 💾 PERSISTENT DATA STORAGE INFRASTRUCTURE STORAGE MATRIX
volumes:
  sqlserver-data-vault:
    driver: local

# 🕸️ ISOLATED LOGICAL BACKEND BRIDGING RECEPTACLE NETWORKS
networks:
  realestate-mesh-network:
    driver: bridge
