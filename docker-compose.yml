version: '3.8'

services:
  # 🐵 1. CENTRAL COORDINATOR ENGINE: Apache Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: realestate-zookeeper-container
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - realestate-mesh-network

  # 📨 2. HIGH-SPEED MESSAGING BUS: Apache Kafka Distributed Event Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: realestate-kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - realestate-mesh-network

    # 📊 2.1. KAFKA MANAGEMENT CONSOLE: Kafka UI (AKHQ / provectus)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: realestate-kafka-ui
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: realestate-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    volumes:
      - ./monitoring/kafka-ui/locals.yml:/etc/kafka-ui/locals.yml
    networks:
      - realestate-mesh-network

  # 🗄️ 3. ISOLATED DATABASE INSTANCE: Microsoft SQL Server 2022 Express Edition
  sqlserver:
    image: mcr.microsoft.com/mssql/server
    container_name: realestate-sqlserver-db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SecureRealEstatePass123!"
      MSSQL_PID: "Express"
    volumes:
      - sqlserver-data-vault:/var/opt/mssql
    networks:
      - realestate-mesh-network

  # 🔍 5. PROBE ENGINE: Blackbox Exporter for HTTP health checks
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: realestate-blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    networks:
      - realestate-mesh-network

  # 📊 6. METRICS COLLECTION: Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: realestate-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - blackbox-exporter
    networks:
      - realestate-mesh-network

  # 📈 7. METRICS VISUALIZATION: Grafana
  grafana:
    image: grafana/grafana:10.1.0
    container_name: realestate-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    depends_on:
      - prometheus
    networks:
      - realestate-mesh-network

# 💾 PERSISTENT DATA STORAGE INFRASTRUCTURE STORAGE MATRIX
volumes:
  sqlserver-data-vault:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# 🕸️ ISOLATED LOGICAL BACKEND BRIDGING RECEPTACLE NETWORKS
networks:
  realestate-mesh-network:
    driver: bridge
